# Referências do editor de cenários (LegacyEditorTest).
# Editor: todas as telas editadas de uma vez (EditEverything) e gravadas. Hash das tabelas, dos
# settings, da duração e do passo, gerado quando a gravação ainda passava pelo
# ConfigurationDAO.saveConfiguration original num HSQLDB.
#
# Regerados em 2026-11-28, de propósito, por duas mudanças na tela "Muscle Units":
#  - a razão tetania/abalo (twTet) e o fator de saturação (b) de cada tipo de unidade motora
#    deixaram de ser fixos no código do ConfigurationAssembler, viraram campos editáveis e passaram
#    a ser gravados no settings do cenário (LegacySettings.MOTOR_UNIT_FORCE). O hash muda porque o
#    settings gravado ganhou a chave nova;
#  - a coluna de força tetânica saiu dos campos editáveis. Ela continua no cenário, lida e devolvida
#    como está, mas nenhum cálculo de força a usa: quem determina a escala de força é o pico do abalo
#    vezes a razão tetania/abalo (CriticallyDampedMuscle e HillMuscle somam gpeak*twTet).
#
# Os resultados de simulação NÃO mudaram: o golden master do motor, em remoto-core, continua o
# mesmo, e um cenário sem a chave nova usa os valores de antes.
