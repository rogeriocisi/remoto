# Each line is one kind of synapse that reaches the pool. The kinetics are those of Destexhe et al. (1994), summed over the synapses of a compartment as in Lytton (1996): a presynaptic spike releases transmitter at the concentration below for the time-to-peak, the bound fraction rises towards αT/(αT+β) with the time constant 1/(αT+β), and falls with 1/β once the pulse ends.
each.line.is.one.kind.of.synapse.that.edb1af=Cada linha é um tipo de sinapse que chega ao núcleo. A cinética é a de Destexhe et al. (1994), somada sobre as sinapses de um compartimento como em Lytton (1996): um disparo pré-sináptico libera transmissor na concentração abaixo durante o tempo até o pico, a fração ligada sobe para αT/(αT+β) com a constante de tempo 1/(αT+β), e cai com 1/β quando o pulso termina.

