# Series modulation: with the modulation "series", the signal follows these points, linearly interpolated, from the first to the last; two points at the same time make a step. Write them as time and value separated by a space, the points separated by ";" (decimal point: 0 20; 1000 40; 1000 10; 3000 10). With the target "rate", the value is added to the rate of the ISI mean, in spikes/s; with the ISI mean 0, it is the rate itself (any rate profile). Start, Stop and the other signal fields are not used.
series.modulation.with.the.modulation.series.9f1288=Modulação por série: com a modulação "série", o sinal segue estes pontos, interpolados linearmente, do primeiro ao último; dois pontos no mesmo tempo fazem um degrau. Escreva-os como tempo e valor separados por espaço, os pontos separados por ";" (ponto decimal: 0 20; 1000 40; 1000 10; 3000 10). Com o alvo "taxa", o valor é somado à taxa da média do ISI, em disparos/s; com a média do ISI 0, ele é a própria taxa (qualquer perfil de taxa). Início, Fim e os demais campos do sinal não são usados.

