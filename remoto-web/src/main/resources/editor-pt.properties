# Pulse width: 1 ms in the original. Axon threshold by current (the original): an axon fires when the intensity passes its threshold, whatever the pulse width. By charge, with leak: each axon integrates the stimulus with the time constant of its kind (motor or sensory) and fires when the charge passes the threshold, giving the strength-duration curve: short pulses need more current, long pulses favor the axons with the longer time constant (the sensory ones, hence the H reflex). The thresholds of the axons keep their meaning: the current of a 1 ms pulse. Chronaxie = time constant × ln 2.
pulse.width.1.ms.in.the.original.axon.4e5c80=Largura do pulso: 1 ms no original. Limiar do axônio por corrente (o original): um axônio dispara quando a intensidade passa do limiar dele, qualquer que seja a largura do pulso. Por carga, com vazamento: cada axônio integra o estímulo com a constante de tempo do tipo dele (motor ou sensorial) e dispara quando a carga passa do limiar, o que dá a curva intensidade-duração: pulsos curtos exigem mais corrente, e pulsos longos favorecem os axônios de constante de tempo maior (os sensoriais, daí o reflexo H). Os limiares dos axônios mantêm o significado deles: a corrente de um pulso de 1 ms. Cronaxia = constante de tempo × ln 2.

