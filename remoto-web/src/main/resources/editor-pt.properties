# Node of Ranvier: each axon has, at the stimulus site, a node and its internode with the channels of the human axon model of Bostock (transient and persistent Na⁺, fast and slow K⁺, h current, leak and Na⁺/K⁺ pump), with the motor and sensory parameters of Howells et al. (2012, J Physiol 590:1625). The strength-duration curve, refractoriness, supernormality and accommodation come from the model; the time constants above are not used. The thresholds of the axons keep their meaning (the current of a 1 ms pulse), and the conduction from the stimulus site is still a delay. Spikes that come from the soma or the receptor do not pass through the node model.
node.of.ranvier.each.axon.has.at.the.8e170b=Nó de Ranvier: cada axônio tem, no ponto de estímulo, um nó e o internó dele com os canais do modelo de axônio humano de Bostock (Na⁺ transitório e persistente, K⁺ rápido e lento, corrente h, vazamento e bomba Na⁺/K⁺), com os parâmetros motores e sensoriais de Howells et al. (2012, J Physiol 590:1625). A curva intensidade-duração, a refratariedade, a supernormalidade e a acomodação saem do modelo; as constantes de tempo acima não são usadas. Os limiares dos axônios mantêm o significado deles (a corrente de um pulso de 1 ms), e a condução a partir do ponto de estímulo continua sendo um atraso. Disparos que vêm do soma ou do receptor não passam pelo modelo do nó.

