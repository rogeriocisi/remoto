# Distance decay (new in ReMoto 4): each synapse of the type gets the weight dec / (dec + d²), d being the distance (mm) between the two cells in the caudal-rostral column, and no synapse is made below 1%. 0 = no decay (weight 1). Motoneurons and interneurons are placed as in the original (Miscellaneous: initial and final positions of each pool); the afferents of a muscle spread over its motoneuron pool, and the descending axons over the whole column. Between Renshaw cells and motoneurons, 0 keeps the declining factors of the Miscellaneous screen.
distance.decay.new.in.remoto.4.each.synapse.6b633a=Decaimento com a distância (novo no ReMoto 4): cada sinapse do tipo recebe o peso dec / (dec + d²), com d a distância (mm) entre as duas células na coluna caudal-rostral, e nenhuma sinapse é feita abaixo de 1%. 0 = sem decaimento (peso 1). Motoneurônios e interneurônios ficam onde o original os punha (Diversos: posições inicial e final de cada núcleo); os aferentes de um músculo se espalham pelo núcleo motor dele, e os axônios descendentes, pela coluna inteira. Entre células de Renshaw e motoneurônios, 0 mantém os fatores de decaimento da tela Diversos.

