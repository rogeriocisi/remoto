anatomical.position.where.a.pool.lies.along.56e98a=Posição anatômica: onde um núcleo fica ao longo da medula, no eixo caudal-rostral, em milímetros. Inicial e Final são as duas pontas do trecho que ele ocupa, e as células se distribuem uniformemente entre elas na ordem do índice (a célula i de n fica em Inicial + (Final − Inicial) × i/(n−1); num núcleo motor as unidades S vêm primeiro). A posição só muda um resultado onde a distância conta: o Decaimento com a distância da tela de Parâmetros sinápticos e os fatores de decaimento entre células de Renshaw e motoneurônios, na tela Diversos.

