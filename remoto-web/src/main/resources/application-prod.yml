# Perfil de PRODUÇÃO: login via OIDC/OAuth2. O ReMoto não guarda senhas.
# Registre o app em cada provedor com o redirect {baseUrl}/login/oauth2/code/{registrationId}
# e defina as variáveis de ambiente. Remova os provedores que não for usar.
spring:
  security:
    oauth2:
      client:
        registration:
          orcid:
            client-name: ORCID
            client-id: ${ORCID_CLIENT_ID}
            client-secret: ${ORCID_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
          github:
            client-name: GitHub
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
        provider:
          orcid:
            issuer-uri: https://orcid.org
