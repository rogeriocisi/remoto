spring:
  application:
    name: remoto
  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 500MB      # importação de cenários (.json/.zip) e de simulações (.zip)
      max-request-size: 500MB

server:
  servlet:
    session:
      timeout: 12h            # a área do navegador não depende da sessão (ver remoto.retention.area-days)
  # atrás de um proxy reverso (nginx/Apache do LEB), descomente:
  # forward-headers-strategy: native

remoto:
  data-dir: ./data                    # REMOTO_DATA_DIR
  public-scenarios-dir: ./scenarios   # REMOTO_PUBLIC_SCENARIOS_DIR
  simulation:
    slots: 0                 # simulações em paralelo; 0 = núcleos da CPU
    max-active-per-user: 2
    max-queued-per-user: 20
    max-per-origin: 20       # rodando ou na fila a partir do mesmo endereço; 0 = sem limite
    max-queued-total: 200    # na fila do servidor inteiro; 0 = sem limite
    threads-per-run: 0       # threads do motor original por simulação; 0 = núcleos ÷ slots
  retention:
    run-days: 30             # execuções terminadas e não fixadas
    area-days: 30            # áreas sem uso (o cookie que as identifica dura o mesmo)

management:
  endpoints:
    web:
      exposure:
        include: health,info
