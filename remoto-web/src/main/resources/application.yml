spring:
  application:
    name: remoto
  mvc:
    problemdetails:
      enabled: true

  messages:
    basename: messages        # messages.properties (inglês, padrão) e messages_pt.properties
    # sem isto, um pedido em inglês cairia no idioma do servidor (pt_BR numa máquina brasileira)
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 500MB      # importação de cenários (.json/.zip) e de simulações (.zip)
      max-request-size: 500MB

server:
  # A 8080 costuma estar ocupada por outro serviço na máquina; o padrão aqui é a 8081, que é
  # também a porta em que o serviço escuta em produção — assim o endereço é o mesmo nos dois
  # lugares. Sobreponível por SERVER_PORT (ver deploy/remoto.env.example).
  port: 8081
  servlet:
    # o simulador fica em <domínio>/simulator; na raiz do domínio está o site descritivo (docs/),
    # que este mesmo Tomcat serve, num segundo contexto (ver SiteConfig e remoto.site-dir). Vale
    # também em desenvolvimento (http://localhost:8081/ e .../simulator/), para que os caminhos
    # sejam os mesmos nos dois lugares. Sobreponível por SERVER_SERVLET_CONTEXT_PATH.
    context-path: /simulator
    session:
      timeout: 12h            # a área do navegador não depende da sessão (ver remoto.retention.area-days)
  # atrás de um proxy reverso (nginx/Apache do LEB), descomente:
  # forward-headers-strategy: native

remoto:
  version: '@project.version@'        # preenchido pelo Maven; o cabeçalho mostra maior.menor
  data-dir: ./data                    # REMOTO_DATA_DIR
  public-scenarios-dir: ./scenarios   # REMOTO_PUBLIC_SCENARIOS_DIR
  # as páginas do site descritivo, servidas na raiz do domínio; no repositório é docs/, e no
  # servidor é a pasta que o deploy espelha (DEPLOY_SITE_DIR). Se a pasta não existir, a raiz
  # fica sem nada e só o simulador responde.
  site-dir: ./docs                    # REMOTO_SITE_DIR
  simulation:
    slots: 0                 # simulações em paralelo; 0 = núcleos da CPU
    max-active-per-user: 2
    max-queued-per-user: 20
    max-per-origin: 20       # rodando ou na fila a partir do mesmo endereço; 0 = sem limite
    max-queued-total: 200    # na fila do servidor inteiro; 0 = sem limite
    threads-per-run: 0       # threads do motor original por simulação; 0 = núcleos ÷ slots
  retention:
    run-days: 30             # execuções terminadas e não fixadas
    area-days: 30            # áreas sem uso (o cookie que as identifica dura o mesmo)
  storage:
    # Teto do disco. Zero é sem limite, que é o certo num computador pessoal. Num servidor
    # aberto os dois valem juntos: o por área segura o uso exagerado de quem está de boa-fé, e
    # o total protege a máquina de quem não está, já que um cookie novo é uma área nova. Ver
    # deploy/remoto.env.example para valores de servidor.
    max-area-bytes: 0        # o que uma área (um navegador) pode ocupar; REMOTO_STORAGE_MAX_AREA_BYTES
    max-total-bytes: 0       # o que todas somadas podem ocupar; REMOTO_STORAGE_MAX_TOTAL_BYTES

# Descrição OpenAPI da API em /api, e o Swagger UI que a mostra. Os caminhos saem sob o
# context-path: <domínio>/simulator/v3/api-docs e <domínio>/simulator/swagger-ui.html.
# A API não tem login (ver SecurityConfig), então o Swagger UI não expõe nada que já não
# estivesse aberto; para desligá-lo num ambiente, use SPRINGDOC_SWAGGERUI_ENABLED=false.
springdoc:
  # fora as páginas Thymeleaf e o /js/i18n.js: só a API REST entra na descrição
  paths-to-match: /api/**
  swagger-ui:
    # o SecurityConfig usa csrf.spa(): a UI lê o cookie XSRF-TOKEN e manda o header
    # X-XSRF-TOKEN, sem o que todo POST/PUT/DELETE do "Try it out" levaria 403
    csrf:
      enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
