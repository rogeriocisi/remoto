spring:
  application:
    name: remoto
  mvc:
    problemdetails:
      enabled: true

  messages:
    basename: messages        # messages.properties (inglês, padrão) e messages_pt.properties
    # sem isto, um pedido em inglês cairia no idioma do servidor (pt_BR numa máquina brasileira)
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 500MB      # importação de cenários (.json/.zip) e de simulações (.zip)
      max-request-size: 500MB

server:
  # A 8080 costuma estar ocupada por outro serviço na máquina; o padrão aqui é a 8081, que é
  # também a porta em que o serviço escuta em produção — assim o endereço é o mesmo nos dois
  # lugares. Sobreponível por SERVER_PORT (ver deploy/remoto.env.example).
  port: 8081
  servlet:
    # o simulador fica em <domínio>/simulator; na raiz do domínio está o site descritivo (docs/).
    # Vale também em desenvolvimento (http://localhost:8081/simulator/), para que os caminhos sejam
    # os mesmos nos dois lugares. Sobreponível por SERVER_SERVLET_CONTEXT_PATH.
    context-path: /simulator
    session:
      timeout: 12h            # a área do navegador não depende da sessão (ver remoto.retention.area-days)
  # atrás de um proxy reverso (nginx/Apache do LEB), descomente:
  # forward-headers-strategy: native

remoto:
  version: '@project.version@'        # preenchido pelo Maven; o cabeçalho mostra maior.menor
  data-dir: ./data                    # REMOTO_DATA_DIR
  public-scenarios-dir: ./scenarios   # REMOTO_PUBLIC_SCENARIOS_DIR
  simulation:
    slots: 0                 # simulações em paralelo; 0 = núcleos da CPU
    max-active-per-user: 2
    max-queued-per-user: 20
    max-per-origin: 20       # rodando ou na fila a partir do mesmo endereço; 0 = sem limite
    max-queued-total: 200    # na fila do servidor inteiro; 0 = sem limite
    threads-per-run: 0       # threads do motor original por simulação; 0 = núcleos ÷ slots
  retention:
    run-days: 30             # execuções terminadas e não fixadas
    area-days: 30            # áreas sem uso (o cookie que as identifica dura o mesmo)

management:
  endpoints:
    web:
      exposure:
        include: health,info
