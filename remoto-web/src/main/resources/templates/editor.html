<!DOCTYPE html>
<html th:lang="#{lang.htmlTag}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{editor.title(${scenario.name})}">Editar – ReMoto</title>
  <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
  <link rel="icon" th:href="@{/img/remoto-icon.svg}" type="image/svg+xml">
  <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
  <meta name="theme-color" content="#1f5f99">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topo">
  <!-- a marca leva sempre à página inicial do site, aqui e nas páginas do site, do guia
       e da API; quem leva à raiz do simulador é o item "Simulador" da barra -->
  <a th:href="#{nav.site.url}" class="marca marca-link" th:title="#{nav.site}">
    <img th:src="@{/img/remoto-icon.svg}" alt="" class="logo" width="26" height="26">
    <strong>ReMoto</strong>
  </a>
  <th:block th:replace="~{fragments :: lugares}"></th:block>
</header>
<!-- a barra 2 do editor: o cenário aberto e o que se faz com ele -->
<div class="barra-cenario">
  <a th:href="@{/}" class="voltar" th:text="#{editor.back}">Meus cenários</a>
  <strong th:text="${scenario.name}">cenário</strong>
  <form th:action="@{/editor/{id}/run(id=${scenario.id})}" method="post" class="inline">
    <button type="submit" th:text="#{editor.run}">Rodar este cenário</button>
  </form>
</div>

<div class="editor">
  <nav class="menu-editor cartao" th:aria-label="#{editor.menu.aria}">
    <a th:href="@{/editor/{id}(id=${scenario.id},screen='general')}"
       th:classappend="${screen == 'general'} ? 'atual'" th:text="#{editor.screen.scenario}">Scenario</a>
    <th:block th:each="g : ${menu}">
      <h4 th:text="${g.title}">Grupo</h4>
      <th:block th:each="item : ${g.items}">
        <a th:if="${item.available}" th:href="@{/editor/{id}(id=${scenario.id},screen=${item.id})}"
           th:classappend="${screen == item.id} ? 'atual'" th:text="${item.title}">Tela</a>
        <span th:unless="${item.available}" class="indisponivel"
              th:text="#{editor.soon(${item.title})}">Tela</span>
      </th:block>
    </th:block>
  </nav>

  <main class="cartao conteudo-editor">
    <p th:if="${saved}" class="ok" th:text="#{editor.saved}">Salvo.</p>
    <p th:if="${param.erro}" class="erro" th:text="${param.erro}">erro</p>
    <ul th:if="${!#lists.isEmpty(errors)}" class="erro">
      <li th:each="e : ${errors}" th:text="${e}">erro</li>
    </ul>

    <!-- Scenario (general.jsp): nome, descrição, seed -->
    <th:block th:if="${screen == 'general'}">
      <h2 th:text="#{editor.screen.scenario}">Scenario</h2>
      <form th:action="@{/editor/{id}(id=${scenario.id})}" method="post" class="form-geral">
        <input type="hidden" name="screen" value="general">
        <input type="hidden" name="etag" th:value="${etag}">
        <label><th:block th:text="#{editor.scenario.name}">Name</th:block>
          <input type="text" name="name" th:value="${scenario.name}" maxlength="60" required></label>
        <label><th:block th:text="#{editor.scenario.description}">Description</th:block>
          <textarea name="description" rows="5" th:text="${scenario.description}"></textarea></label>
        <label><th:block th:text="#{editor.scenario.seed}">Seed</th:block>
          <input type="text" name="seed" th:value="${scenario.seed}" inputmode="numeric"></label>
        <p class="vazio" th:utext="#{editor.general.note}">
          Duração e passo ficam em Simulation → Duration and Time Step.
        </p>
        <button type="submit" th:text="#{editor.save}">Salvar</button>
      </form>
    </th:block>

    <!-- Telas do site antigo (rótulos em inglês nos dois idiomas: são os do site original) -->
    <th:block th:if="${view != null}">
      <h2 th:text="${view.title}">Tela</h2>
      <!-- o que a tela configura, em duas frases; o detalhe de cada campo fica nas notas, logo
           acima do Salvar, para onde o "saiba mais" leva -->
      <p class="intro-tela" th:if="${view.intro != null}">
        <th:block th:text="${view.intro}">explicação</th:block>
        <a th:unless="${#lists.isEmpty(view.notes)}" href="#notas-tela"
           th:text="#{editor.learnMore}">Saiba mais</a>
      </p>

      <form th:if="${!#lists.isEmpty(view.selectors)}" th:action="@{/editor/{id}(id=${scenario.id})}" method="get"
            class="seletores" id="seletores-tela" th:data-aviso="#{editor.discard}">
        <input type="hidden" name="screen" th:value="${screen}">
        <label th:each="s : ${view.selectors}">
          <span th:text="${s.label}">Pool</span>
          <select th:name="${s.name}">
            <option th:each="o : ${s.options}" th:value="${o.value}" th:text="${o.label}"
                    th:selected="${o.value == s.selected}">opção</option>
          </select>
        </label>
        <noscript><button type="submit" th:text="#{editor.selector.change}">Trocar</button></noscript>
      </form>

      <form th:action="@{/editor/{id}(id=${scenario.id})}" method="post" id="form-tela"
            th:data-aviso-grupo="#{editor.group.moves}">
        <input type="hidden" name="screen" th:value="${screen}">
        <input type="hidden" name="etag" th:value="${etag}">
        <input th:each="s : ${view.selectors}" type="hidden" th:name="|sel.${s.name}|" th:value="${s.selected}">

        <section th:each="sec : ${view.sections}" class="secao-editor">
          <h3 th:if="${sec.title != null}" th:text="${sec.title}">Seção</h3>
          <p th:if="${#lists.isEmpty(sec.rows)}" class="vazio" th:text="#{editor.section.empty}">
            Nada para editar nesta seleção.</p>
          <div class="tabela-rolavel" th:unless="${#lists.isEmpty(sec.rows)}">
            <!-- MATRIX: parâmetros nas linhas, tipos nas colunas (from/to) -->
            <table th:if="${sec.layout.name() == 'MATRIX'}" class="tabela tabela-editor matriz">
              <thead>
              <tr>
                <th></th>
                <th th:each="h : ${sec.headers}" th:colspan="${sec.paired} ? 2 : 1" th:text="${h}">S</th>
              </tr>
              <tr th:if="${sec.paired}" class="sub">
                <th></th>
                <th:block th:each="h : ${sec.headers}">
                  <th th:text="#{editor.matrix.from}">from</th><th th:text="#{editor.matrix.to}">to</th></th:block>
              </tr>
              </thead>
              <tbody>
              <tr th:each="r : ${sec.rows}">
                <th th:text="${r.label}">parâmetro</th>
                <td th:each="c : ${r.cells}" th:colspan="${c.span}">
                  <th:block th:replace="~{editor-campo :: campo(${c}, false)}"></th:block>
                </td>
              </tr>
              </tbody>
            </table>
            <!-- LIST: um item por linha -->
            <table th:if="${sec.layout.name() == 'LIST'}" class="tabela tabela-editor">
              <thead>
              <!-- sec.order: a ordem das colunas na tela, que pode não ser a dos campos -->
              <tr><th th:text="${sec.rowHeader}"></th>
                <th th:each="i : ${sec.order}" th:text="${sec.headers[i]}">campo</th></tr>
              </thead>
              <tbody>
              <th:block th:each="r : ${sec.rows}">
                <tr th:if="${r.header}" class="divisao">
                  <th th:colspan="${#lists.size(sec.headers) + 1}" th:text="${r.label}">grupo</th>
                </tr>
                <tr th:unless="${r.header}">
                  <th th:text="${r.label}">item</th>
                  <td th:each="i : ${sec.order}"><th:block
                      th:replace="~{editor-campo :: campo(${r.cells[i]},
                          ${sec.groupProperty != null and #strings.endsWith(r.cells[i].name(), '.' + sec.groupProperty)})}"></th:block></td>
                </tr>
              </th:block>
              </tbody>
            </table>
          </div>
        </section>

        <ul th:if="${!#lists.isEmpty(view.notes)}" class="notas" id="notas-tela"
            th:aria-label="#{editor.notes.aria}">
          <li th:each="n : ${view.notes}" th:text="${n}">nota</li>
        </ul>
        <button type="submit" th:text="#{editor.save}">Salvar</button>
      </form>
    </th:block>
  </main>
</div>

<!--
  Trocar um seletor, ir para outra tela ou rodar o cenário recarrega a página: o que foi digitado e
  ainda não foi salvo se perde. Antes só acontecia, sem aviso nenhum.
-->
<script>
  (function () {
    var seletores = document.getElementById('seletores-tela');
    var form = document.getElementById('form-tela');
    if (!form) return;
    var sujo = false;
    form.addEventListener('input', function () { sujo = true; });
    form.addEventListener('change', function () { sujo = true; });
    form.addEventListener('submit', function () { sujo = false; });

    var aviso = (seletores && seletores.dataset.aviso) || '';
    function podeSair() { return !sujo || window.confirm(aviso); }

    if (seletores) {
      // o seletor trocava de seleção no onchange; agora pergunta antes, e volta ao que estava
      // quando o usuário prefere ficar e salvar
      var anteriores = new Map();
      seletores.querySelectorAll('select').forEach(function (s) { anteriores.set(s, s.value); });
      seletores.addEventListener('change', function (e) {
        if (!podeSair()) {
          e.target.value = anteriores.get(e.target);
          return;
        }
        seletores.submit();
      });
    }

    // A lista é agrupada por um campo da própria linha (o compartimento, nas sinapses): enquanto
    // o combo estiver diferente do que está gravado, a linha ainda aparece no grupo antigo, e a
    // marca diz que ela vai mudar de grupo quando for salva.
    var avisoGrupo = form.dataset.avisoGrupo || '';
    form.querySelectorAll('select[data-agrupa]').forEach(function (s) {
      s.addEventListener('change', function () {
        var tr = s.closest('tr');
        var mudou = s.value !== s.dataset.salvo;
        tr.classList.toggle('muda-de-grupo', mudou);
        if (mudou) {
          tr.firstElementChild.dataset.aviso = avisoGrupo;
        } else {
          delete tr.firstElementChild.dataset.aviso;
        }
      });
    });

    // sair da tela por um link (outra tela, a página inicial, o outro idioma) ou rodar o cenário
    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href]') : null;
      if (a && !podeSair()) {
        e.preventDefault();
      }
    });
    document.querySelectorAll('form').forEach(function (f) {
      if (f !== form && f !== seletores) {
        f.addEventListener('submit', function (e) { if (!podeSair()) e.preventDefault(); });
      }
    });
  })();
</script>
</body>
</html>
