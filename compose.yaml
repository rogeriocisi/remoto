# docker compose up --build   →   http://localhost:8080
#
# Por padrão sobe no perfil "dev" (usuários de teste, só para uso local).
# Em produção: SPRING_PROFILES_ACTIVE=prod e as credenciais OIDC (ver application-prod.yml).
services:
  remoto:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # SPRING_PROFILES_ACTIVE: prod
      # ORCID_CLIENT_ID: ...
      # ORCID_CLIENT_SECRET: ...
      # GITHUB_CLIENT_ID: ...
      # GITHUB_CLIENT_SECRET: ...
      # REMOTO_SIMULATION_SLOTS: "8"
    volumes:
      - remoto-data:/data
    restart: unless-stopped

volumes:
  remoto-data:
