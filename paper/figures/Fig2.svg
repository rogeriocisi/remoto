<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="64mm" viewBox="0 0 174 64"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1L10,5L0,9z" fill="#000"/></marker></defs><rect width="174" height="64" fill="#FFFFFF"/>
<text x="2" y="21" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="start" font-weight="bold" fill="#000000">Simulation</text>
<text x="2" y="24.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="start" font-weight="bold" fill="#000000">thread</text>
<text x="2" y="45" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="start" font-weight="bold" fill="#000000">Worker</text>
<text x="2" y="48.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="start" font-weight="bold" fill="#000000">threads</text>
<rect x="22" y="12" width="22" height="16" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.25"/><text x="33" y="17.7" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Nerves</text><text x="33" y="21" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">stimulus</text><text x="33" y="24.3" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">pulses</text>
<rect x="48" y="12" width="38" height="16" rx="1" fill="#F2F2F2" stroke="#000000" stroke-width="0.25"/><text x="67" y="17.7" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Tracts, afferents, noise</text><text x="67" y="21" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">random draws, in the</text><text x="67" y="24.3" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">order of the serial loop</text>
<rect x="48" y="36" width="38" height="16" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.25"/><text x="67" y="41.7" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Motoneurons, interneurons</text><text x="67" y="45" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">Runge-Kutta, no draws,</text><text x="67" y="48.3" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">chunks of 8 neurons</text>
<rect x="98" y="12" width="30" height="16" rx="1" fill="#F2F2F2" stroke="#000000" stroke-width="0.25"/><text x="113" y="17.7" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Deliver spikes</text><text x="113" y="21" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">fired in this step,</text><text x="113" y="24.3" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">in serial order</text>
<rect x="132" y="12" width="20" height="16" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.25"/><text x="142" y="17.7" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Muscles</text><text x="142" y="21" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">force, EMG,</text><text x="142" y="24.3" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">receptors</text>
<rect x="156" y="12" width="16" height="16" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.25"/><text x="164" y="17.7" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Joint</text><text x="164" y="21" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">torque,</text><text x="164" y="24.3" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">angle</text>
<path d="M44,20L48,20" stroke="#000000" stroke-width="0.3" fill="none" marker-end="url(#ah)"/>
<path d="M128,20L132,20" stroke="#000000" stroke-width="0.3" fill="none" marker-end="url(#ah)"/>
<path d="M152,20L156,20" stroke="#000000" stroke-width="0.3" fill="none" marker-end="url(#ah)"/>
<path d="M46,9V54" stroke="#000" stroke-width="0.3" stroke-dasharray="0.9 0.7" fill="none"/>
<text x="46" y="7.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">start barrier</text>
<path d="M92,9V54" stroke="#000" stroke-width="0.3" stroke-dasharray="0.9 0.7" fill="none"/>
<text x="92" y="7.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">end barrier</text>
<path d="M86,20L98,20" stroke="#000000" stroke-width="0.3" fill="none" marker-end="url(#ah)"/>
<path d="M86,44L95,44L95,23" stroke="#000000" stroke-width="0.3" fill="none" marker-end="url(#ah)"/>
<path d="M40,28L40,44L48,44" stroke="#000000" stroke-width="0.3" fill="none" marker-end="url(#ah)"/>
<text x="98" y="42" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="start" fill="#000000">A spike delivered at step n is due at</text>
<text x="98" y="45.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="start" fill="#000000">step n + 1 or later, because every</text>
<text x="98" y="49" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="start" fill="#000000">synaptic delay exceeds one step</text>
<path d="M22,61H172" stroke="#000" stroke-width="0.25" fill="none" marker-end="url(#ah)"/>
<text x="97" y="59.6" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">one integration step (0.05 ms in the public scenarios)</text>
</svg>