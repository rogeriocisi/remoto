<rect x="55" y="60.5" width="64" height="12.5" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.25"/><text x="87" y="64.25" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Outputs</text><text x="87" y="67.75" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">time series, spike trains, tables,</text><text x="87" y="71.25" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">catalogue of results</text>
