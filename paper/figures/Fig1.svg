<text x="87" y="9.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">remoto-core (plain Java, no dependencies)</text>
<rect x="55" y="12.5" width="64" height="10.5" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.25"/><text x="87" y="17" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Scenario format and validation</text><text x="87" y="20.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">typed model configuration</text>
<rect x="55" y="25" width="64" height="17.5" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.25"/><text x="87" y="29.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#000000">Models</text><text x="87" y="33" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">channels, synapses, membranes, tracts,</text><text x="87" y="36.5" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">afferents, motor units, muscles, EMG,</text><text x="87" y="40" font-family="Arial, Helvetica, sans-serif" font-size="2.8" text-anchor="middle" fill="#000000">spindle, tendon organ, joint</text>
